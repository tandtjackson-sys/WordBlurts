<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy - Word Blurts!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1, h2 { color: #1a1a1a; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .back-link { font-weight: bold; }
        .lang-btn {
            background: #f0f4f8;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: bold;
        }
        .lang-btn:hover { background: #e2e8f0; }
    </style>
</head>
<body>
    <div class="container" id="privacy-content">
        <div class="top-bar">
            <a href="index.html" class="back-link" id="back-link">&larr; Back to Word Blurts!</a>
            <button class="lang-btn" id="lang-btn" onclick="togglePageLang()">🇪🇸 Español</button>
        </div>

        <div id="privacy-body"></div>
    </div>

    <script>
        let pageLang = localStorage.getItem("wordblurts_lang") || "en";

        function renderPrivacyPage() {
            const isEs = (pageLang === "es");
            document.documentElement.lang = isEs ? "es" : "en";
            document.title = isEs ? "Política de Privacidad - Word Blurts!" : "Privacy Policy - Word Blurts!";

            const backLink = document.getElementById("back-link");
            const langBtn = document.getElementById("lang-btn");
            const bodyDiv = document.getElementById("privacy-body");

            if (backLink) backLink.innerHTML = isEs ? "&larr; Volver a Word Blurts!" : "&larr; Back to Word Blurts!";
            if (langBtn) langBtn.textContent = isEs ? "🇺🇸 English" : "🇪🇸 Español";

            if (bodyDiv && isEs) {
                bodyDiv.innerHTML = `
                    <h1>Política de Privacidad</h1>
                    <p>Última actualización: Octubre de 2026</p>

                    <p>En <strong>Word Blurts!</strong> (accesible desde wordblurts.com), la privacidad de nuestros visitantes es una de nuestras principales prioridades. Este documento de Política de Privacidad describe los tipos de información que Word Blurts! recopila y registra, y cómo la utilizamos.</p>

                    <h2>Archivos de Registro</h2>
                    <p>Word Blurts! sigue un procedimiento estándar de uso de archivos de registro. Estos archivos registran a los visitantes cuando visitan sitios web. La información recopilada incluye direcciones de protocolo de Internet (IP), tipo de navegador, proveedor de servicios de Internet (ISP), marca de fecha y hora, páginas de referencia o salida y, posiblemente, el número de clics.</p>

                    <h2>Cookies y Balizas Web</h2>
                    <p>Como cualquier otro sitio web, Word Blurts! utiliza "cookies". Estas cookies almacenan información que incluye las preferencias de los visitantes y las páginas del sitio web a las que el visitante accedió o visitó.</p>

                    <h2>Cookie DART de Google DoubleClick</h2>
                    <p>Google es uno de los proveedores externos en nuestro sitio. También utiliza cookies, conocidas como cookies DART, para mostrar anuncios a los visitantes de nuestro sitio en función de su visita a wordblurts.com y otros sitios en Internet. Sin embargo, los visitantes pueden optar por rechazar el uso de las cookies DART visitando la Política de Privacidad de la red de contenido y anuncios de Google en la siguiente URL: <a href="https://google.com" target="_blank" rel="noopener noreferrer">https://google.com</a></p>

                    <h2>Políticas de Privacidad de Socios Publicitarios</h2>
                    <p>Los servidores de anuncios o redes publicitarias de terceros utilizan tecnologías como cookies, JavaScript o balizas web en sus respectivos anuncios y enlaces que aparecen en Word Blurts!, los cuales se envían directamente a los navegadores de los usuarios. Reciben automáticamente su dirección IP cuando esto ocurre. Estas tecnologías se utilizan para medir la efectividad de sus campañas publicitarias y/o personalizar el contenido publicitario que ve en los sitios web que visita.</p>
                    <p>Tenga en cuenta que Word Blurts! no tiene acceso ni control sobre estas cookies que utilizan los anunciantes externos.</p>

                    <h2>Políticas de Privacidad de Terceros</h2>
                    <p>La Política de Privacidad de Word Blurts! no se aplica a otros anunciantes o sitios web. Por lo tanto, le recomendamos consultar las respectivas Políticas de Privacidad de estos servidores de anuncios de terceros para obtener información más detallada, incluidas sus prácticas e instrucciones sobre cómo excluirse de ciertas opciones.</p>
                `;
            }
            else if (bodyDiv) {
                bodyDiv.innerHTML = `
                    <h1>Privacy Policy</h1>
                    <p>Last updated: October 2026</p>

                    <p>At <strong>Word Blurts!</strong> (accessible from wordblurts.com), the privacy of our visitors is one of our main priorities. This Privacy Policy document outlines the types of information that is collected and recorded by Word Blurts! and how we use it.</p>

                    <h2>Log Files</h2>
                    <p>Word Blurts! follows a standard procedure of using log files. These files log visitors when they visit websites. The information collected includes internet protocol (IP) addresses, browser type, Internet Service Provider (ISP), date and time stamp, referring/exit pages, and possibly the number of clicks.</p>

                    <h2>Cookies and Web Beacons</h2>
                    <p>Like any other website, Word Blurts! uses "cookies". These cookies store information including visitors' preferences and the pages on the website that the visitor accessed or visited.</p>

                    <h2>Google DoubleClick DART Cookie</h2>
                    <p>Google is one of a third-party vendor on our site. It also uses cookies, known as DART cookies, to serve ads to our site visitors based upon their visit to wordblurts.com and other sites on the internet. However, visitors may choose to decline the use of DART cookies by visiting the Google ad and content network Privacy Policy at the following URL: <a href="https://google.com" target="_blank" rel="noopener noreferrer">https://google.com</a></p>

                    <h2>Advertising Partners Privacy Policies</h2>
                    <p>Third-party ad servers or ad networks use technologies like cookies, JavaScript, or Web Beacons that are used in their respective advertisements and links that appear on Word Blurts!, which are sent directly to users' browsers. They automatically receive your IP address when this occurs. These technologies are used to measure the effectiveness of their advertising campaigns and/or to personalize the advertising content that you see on websites that you visit.</p>
                    <p>Note that Word Blurts! has no access to or control over these cookies that are used by third-party advertisers.</p>

                    <h2>Third Party Privacy Policies</h2>
                    <p>Word Blurts!'s Privacy Policy does not apply to other advertisers or websites. Thus, we advise you to consult the respective Privacy Policies of these third-party ad servers for more detailed information. It may include their practices and instructions about how to opt-out of certain options.</p>
                `;
            }
        }

        function togglePageLang() {
            pageLang = (pageLang === "es") ? "en" : "es";
            localStorage.setItem("wordblurts_lang", pageLang);
            renderPrivacyPage();
        }

        renderPrivacyPage();
    </script>
</body>
</html>
