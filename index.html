<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Blurts!</title>
  <style>
    :root {
      --bg-dark: #0b0d19;
      --card-bg: #16192b;
      --accent-purple: #7b2cbf;
      --accent-cyan: #00f5d4;
      --accent-green: #2ec4b6;
      --accent-red: #e63946;
      --text-main: #ffffff;
      --text-muted: #a0aab8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(123, 44, 191, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0, 245, 212, 0.1) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 6px;
      color: var(--accent-cyan);
      text-shadow: 0 0 12px rgba(0, 245, 212, 0.4);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .mode-toggle {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #252a44;
      color: var(--text-main);
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-active {
      background: var(--accent-purple);
      box-shadow: 0 0 10px rgba(123, 44, 191, 0.5);
    }

    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.25);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .stat-item span {
      display: block;
      font-weight: bold;
      color: var(--accent-cyan);
      font-size: 1.1rem;
    }

    .card-display {
      background: #0f1222;
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 30px 20px;
      margin-bottom: 20px;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .word-prompt {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .category-tag {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--accent-cyan);
    }

    .action-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-primary {
      background: var(--accent-purple);
      font-size: 1.1rem;
      padding: 14px;
    }

    .scoring-buttons {
      display: flex;
      gap: 12px;
    }

    .btn-pass {
      background: var(--accent-green);
    }

    .btn-fail {
      background: var(--accent-red);
    }

    /* MODAL STYLES */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 6, 12, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--accent-purple);
      border-radius: 16px;
      padding: 28px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 0 25px rgba(123, 44, 191, 0.3);
    }

    .modal-card h2 {
      color: var(--accent-cyan);
      margin-bottom: 12px;
    }

    .emoji-grid {
      font-size: 1.6rem;
      letter-spacing: 4px;
      margin: 16px 0;
      line-height: 1.4;
      word-break: break-all;
    }

    .btn-share {
      background: var(--accent-cyan);
      color: #000;
      font-weight: bold;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
    }

    .btn-close {
      background: transparent;
      color: var(--text-muted);
      margin-top: 8px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Word Blurts! 🚀</h1>
    <p class="subtitle">Quick-fire word associations in space</p>

    <div class="mode-toggle">
      <button id="dailyModeBtn" class="btn btn-active">📅 Daily Blurt</button>
      <button id="freePlayBtn" class="btn">🎲 Free Play</button>
    </div>

    <div class="stats-bar">
      <div class="stat-item">
        Round
        <span id="roundDisplay">1/10</span>
      </div>
      <div class="stat-item">
        Score
        <span id="scoreDisplay">0</span>
      </div>
      <div class="stat-item">
        Streak
        <span id="streakDisplay">🔥 0</span>
      </div>
    </div>

    <div class="card-display">
      <div id="categoryDisplay" class="category-tag">Press Start</div>
      <div id="wordDisplay" class="word-prompt">READY?</div>
    </div>

    <div class="action-controls">
      <button id="startBtn" class="btn btn-primary">Start Round</button>
      
      <div id="scoringControls" class="scoring-buttons" style="display: none;">
        <button id="passBtn" class="btn btn-pass">✅ Got It</button>
        <button id="failBtn" class="btn btn-fail">❌ Missed</button>
      </div>
    </div>
  </div>

  <!-- RESULTS MODAL -->
  <div id="resultsModal" class="modal-overlay">
    <div class="modal-card">
      <h2>Daily Challenge Complete!</h2>
      <p style="margin-bottom: 8px;">Score: <strong id="resScore">0/10</strong></p>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Streak: <strong id="resStreak">🔥 0</strong></p>
      
      <div id="emojiGridDisplay" class="emoji-grid"></div>

      <button id="shareResultsBtn" class="btn btn-share">📋 Share Results</button>
      <button id="closeModalBtn" class="btn btn-close">Close</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
