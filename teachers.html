<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Classroom Word Game & Vocabulary Warm-Up | Word Blurts!</title>
    <meta name="description" content="Word Blurts! is a free, no-login online word game for classrooms. Perfect for Smartboards, Chromebooks, 5-minute vocabulary warm-ups, and fun, brain breaks!">
    <meta name="keywords" content="classroom word game, free smartboard games, vocabulary warm up, brain break games, middle school word games, ESL games no login, online team games for students">

    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://wordblurts.com">
    <meta property="og:title" content="Word Blurts! - Free Classroom Word Game & Brain Break">
    <meta property="og:description" content="Zero setup, no student logins or personal data required. Fast-paced, 15-second category challenges for phones, Smartboards and Chromebooks.">
    <meta property="og:image" content="https://wordblurts.com">

    <!-- Favicon & PWA Tags -->
    <meta name="theme-color" content="#7b2cbf">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        :root {
            --primary-purple: #7b2cbf;
            --accent-yellow: #f59e0b;
            --accent-green: #10b981;
            --card-bg: rgba(13, 16, 38, 0.85);
            --card-border: rgba(0, 240, 255, 0.3);
            --text-color: #f8fafc;
            --text-muted: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #090d16;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin: 0 auto;
        }

        .top-nav-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        header {
            text-align: center;
            padding: 10px 0 10px;
        }

        .back-link {
            color: #00f0ff;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .lang-toggle-btn {
            background: rgba(0, 240, 255, 0.12);
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .lang-toggle-btn:hover {
            background: rgba(0, 240, 255, 0.25);
        }

        h1 {
            color: var(--accent-yellow);
            font-size: 1.8rem;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .hero-card {
            background: linear-gradient(135deg, rgba(123, 44, 191, 0.3) 0%, rgba(13, 16, 38, 0.9) 100%);
            border: 2px solid var(--accent-green);
            border-radius: 20px;
            padding: 28px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.2);
        }

        .play-now-btn {
            display: inline-block;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            font-size: 1.4rem;
            font-weight: 800;
            padding: 14px 40px;
            border-radius: 50px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .play-now-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.6);
        }

        .section-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }

        h2 {
            color: #00f0ff;
            font-size: 1.4rem;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        ul {
            list-style: none;
            padding-left: 0;
        }

        li {
            margin-bottom: 12px;
            padding-left: 28px;
            position: relative;
            color: var(--text-muted);
        }

        li::before {
            content: "✔";
            position: absolute;
            left: 0;
            color: var(--accent-green);
            font-weight: bold;
        }

        .use-case-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .use-case-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
        }

        .use-case-box h4 {
            color: #ffffff;
            font-size: 1rem;
            margin-bottom: 6px;
        }

        .use-case-box p {
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .faq-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .faq-item strong {
            color: var(--accent-yellow);
            display: block;
            margin-bottom: 4px;
        }

        footer {
            text-align: center;
            padding: 30px 0 10px;
            font-size: 0.85rem;
            color: #8a99ad;
        }

        footer a {
            color: #00f0ff;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            .hero-card { padding: 20px 15px; }
            .play-now-btn { font-size: 1.1rem; padding: 12px 28px; }
        }
    </style>

    <!-- Schema Markup for Educational Web Application & FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "name": "Word Blurts! Classroom Edition",
          "url": "https://wordblurts.com",
          "applicationCategory": "EducationalApplication",
          "genre": "Classroom Vocabulary & Brain Break Game",
          "operatingSystem": "All (Web Browser)",
          "offers": {
            "@type": "Offer",
            "price": "0.00",
            "priceCurrency": "USD"
          },
          "description": "No-login, fast-paced browser word game, designed for classroom Smartboards, Chromebooks, vocabulary practice, and quick brain breaks."
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Is Word Blurts! free for school classrooms?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, Word Blurts! is 100% free to use on Smartboards, Chromebooks, tablets, phones and desktop computers with no paid upgrades or accounts required."
              }
            },
            {
              "@type": "Question",
              "name": "Do students need to create an account or sign in?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. Word Blurts! requires zero student accounts, emails, or logins."
              }
            }
          ]
        }
      ]
    }
    </script>
</head>
<body>
    <div class="container">
        <div class="top-nav-row">
            <a href="index.html" class="back-link" id="teachers-back-link">&larr; Back to Word Blurts! Game</a>
            <button class="lang-toggle-btn" id="teachers-lang-btn" onclick="toggleTeachersLang()">🇪🇸 Español</button>
        </div>

        <div id="teachers-main-content"></div>

        <footer id="teachers-footer"></footer>
    </div>
    <script>
        let teachersLang = localStorage.getItem("wordblurts_lang") || "en";

        function renderTeachersPage() {
            const isEs = (teachersLang === "es");
            document.documentElement.lang = isEs ? "es" : "en";
            document.title = isEs
                ? "Juego de Palabras Gratuito para el Aula y Vocabulario | Word Blurts!"
                : "Free Classroom Word Game & Vocabulary Warm-Up | Word Blurts!";

            const backLink = document.getElementById("teachers-back-link");
            const langBtn = document.getElementById("teachers-lang-btn");
            const mainContent = document.getElementById("teachers-main-content");
            const footer = document.getElementById("teachers-footer");

            if (backLink) {
                backLink.innerHTML = isEs ? "&larr; Volver al juego Word Blurts!" : "&larr; Back to Word Blurts! Game";
            }
            if (langBtn) {
                langBtn.textContent = isEs ? "🇺🇸 English" : "🇪🇸 Español";
            }

            if (mainContent) {
                mainContent.innerHTML = isEs ? `
                    <header>
                        <h1>Juego de Palabras Gratuito y "Descanso Mental"</h1>
                        <p class="subtitle">Calentamientos de vocabulario rápidos y sin inicio de sesión para pizarras digitales y Chromebooks.</p>
                    </header>
                    <div class="hero-card">
                        <h2>Calentamiento Instantáneo para el Aula</h2>
                        <p>Actividad rápida de 5 minutos para iniciar clases o dar un descanso mental. <strong>Word Blurts!</strong> funciona directo en tu navegador.</p>
                        <a href="index.html" class="play-now-btn">🎮 Iniciar Juego en el Aula</a>
                    </div>
                    <div class="section-card">
                        <h2>Por Qué los Maestros Aman Word Blurts!</h2>
                        <ul>
                            <li><strong>Sin Cuentas de Estudiantes:</strong> Cumple con COPPA/FERPA. Sin datos personales o registros.</li>
                            <li><strong>Optimizado para Pizarras:</strong> Texto grande de alto contraste y controles sencillos.</li>
                            <li><strong>Marcador de Equipos:</strong> Divide el salón en Equipo 1 y Equipo 2 para participación instantánea.</li>
                            <li><strong>Bilingüe (Inglés/Español):</strong> Traducción en un clic y anuncios de voz ideales para aulas ESL/ELL.</li>
                            <li><strong>100% Gratis:</strong> Sin muros de pago o suscripciones.</li>
                        </ul>
                    </div>
                    <div class="section-card">
                        <h2>Cómo Usar Word Blurts! en Tu Aula</h2>
                        <div class="use-case-grid">
                            <div class="use-case-box"><h4>🔔 Actividad Inicial</h4><p>2 o 3 rondas rápidas al entrar para activar la memoria.</p></div>
                            <div class="use-case-box"><h4>🧠 Descanso Mental</h4><p>Recompensa enérgica entre bloques de lecciones.</p></div>
                            <div class="use-case-box"><h4>🏆 Desafío de Equipos</h4><p>Competencia por puntos con reloj de 15 segundos.</p></div>
                            <div class="use-case-box"><h4>📝 Planes para Suplentes</h4><p>Actividad sin preparación previa para docentes invitados.</p></div>
                        </div>
                    </div>
                    <div class="section-card">
                        <h2>Preguntas Frecuentes</h2>
                        <div class="faq-item"><strong>P: ¿Es gratuito?</strong><p>Sí, 100% gratuito para escuelas y maestros.</p></div>
                        <div class="faq-item"><strong>P: ¿Requiere descargas?</strong><p>No, es una PWA basada en navegador (Chrome, Safari, Edge, Firefox).</p></div>
                        <div class="faq-item"><strong>P: ¿Cómo ayuda a aprender?</strong><p>Fomenta recuperación léxica, amplía vocabulario y mejora la velocidad cognitiva.</p></div>
                    </div>
                ` : `
                    <header>
                        <h1>Free Classroom Word Game and "Brain Break"</h1>
                        <p class="subtitle">Fast-paced, no-login vocabulary warm-ups for Smartboards and Chromebooks.</p>
                    </header>
                    <div class="hero-card">
                        <h2>Instant Classroom Warm-Up</h2>
                        <p>Quick 5-minute activity to start class or give students a mental break. <strong>Word Blurts!</strong> runs directly in your browser.</p>
                        <a href="index.html" class="play-now-btn">🎮 Launch Game in Classroom</a>
                    </div>
                    <div class="section-card">
                        <h2>Why Educators Love Word Blurts!</h2>
                        <ul>
                            <li><strong>Zero Student Logins:</strong> COPPA/FERPA compliant. No personal data or sign-ups required.</li>
                            <li><strong>Smartboard Optimized:</strong> High-contrast text and simple controls for easy projecting.</li>
                            <li><strong>Built-In Scoreboard:</strong> Split your room into Team 1 vs. Team 2 for instant engagement.</li>
                            <li><strong>Bilingual (English & Spanish):</strong> One-click translation and voice announcements for ESL/ELL.</li>
                            <li><strong>100% Free Forever:</strong> No paywalls or hidden subscriptions.</li>
                        </ul>
                    </div>
                    <div class="section-card">
                        <h2>How to Use Word Blurts! in Your Classroom</h2>
                        <div class="use-case-grid">
                            <div class="use-case-box"><h4>🔔 Bell Ringer</h4><p>Run 2-3 fast rounds when students enter to practice active recall.</p></div>
                            <div class="use-case-box"><h4>🧠 Active Brain Break</h4><p>Quick high-energy reward between heavy-lesson blocks.</p></div>
                            <div class="use-case-box"><h4>🏆 Friday Challenge</h4><p>Competing teams race against a 15-second timer.</p></div>
                            <div class="use-case-box"><h4>📝 Zero-Prep Subs</h4><p>Easy emergency plans for guest teachers with zero training.</p></div>
                        </div>
                    </div>
                    <div class="section-card">
                        <h2>Frequently Asked Questions</h2>
                        <div class="faq-item"><strong>Q: Is it free?</strong><p>Yes, 100% free for teachers and educational institutions.</p></div>
                        <div class="faq-item"><strong>Q: Any downloads needed?</strong><p>No, it's a browser-based PWA (Chrome, Safari, Edge, Firefox).</p></div>
                        <div class="faq-item"><strong>Q: How does it help learning?</strong><p>Encourages rapid lexical retrieval and expands vocabulary.</p></div>
                    </div>
                `;
            }

            if (footer) {
                footer.innerHTML = isEs
                    ? `&copy; 2026 Word Blurts! | <a href="index.html">Jugar</a> | <a href="teachers.html">Para maestros</a> | <a href="privacy.html">Política de privacidad</a>`
                    : `&copy; 2026 Word Blurts! | <a href="index.html">Play Game</a> | <a href="teachers.html">For Teachers</a> | <a href="privacy.html">Privacy Policy</a>`;
            }
        }

        function toggleTeachersLang() {
            teachersLang = (teachersLang === "es") ? "en" : "es";
            localStorage.setItem("wordblurts_lang", teachersLang);
            renderTeachersPage();
        }

        renderTeachersPage();
    </script>
</body>
</html>
